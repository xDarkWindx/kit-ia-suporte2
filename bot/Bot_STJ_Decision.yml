    - data:
        type: code
        title: Montar resposta do processo
        code_language: python3
        code: "import json\n\ndef main(corpo: str, status: int) -> dict:\n    \"\"\"Monta a resposta só com o que a API devolveu\
          \ (sem LLM: o bot não inventa andamento).\"\"\"\n    try:\n        dados = json.loads(corpo)\n    except ValueError:\n\
          \        dados = {}\n    if status == 200:\n        texto = (f\"Processo {dados.get('numero')}\\n\"\n          \
          \       f\"Classe: {dados.get('classe')}\\n\"\n                 f\"Órgão: {dados.get('orgao')}\\n\"\n          \
          \       f\"Última movimentação: {dados.get('ultima_movimentacao')} em {dados.get('data')}\\n\"\n               \
          \  \"Fonte: API do tribunal (simulada). Não é possível prever a data do julgamento.\")\n    elif status in (401,\
          \ 403):\n        texto = \"Este processo tem acesso restrito. Entre com seu login no portal do tribunal ou procure\
          \ seu advogado.\"\n    elif status == 404:\n        texto = \"Não encontrei esse processo. Confira o número, por\
          \ favor.\"\n    elif status == 429:\n        texto = \"Muitas consultas seguidas. Aguarde 1 minuto e tente de novo.\"\
          \n    else:\n        texto = \"Não consegui consultar agora. Quer falar com um atendente?\"\n    return {\"resposta\"\
          : texto}\n"
        variables:
        - variable: corpo
          value_selector:
          - api_tribunal
          - body
        - variable: status
          value_selector:
          - api_tribunal
          - status_code
        outputs:
