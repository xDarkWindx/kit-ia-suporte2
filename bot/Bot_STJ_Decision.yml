        code_language: python3
        code: "import json\n\ndef main(corpo: str, status: int, tipo: str) -> dict:\n    try:\n        dados = json.loads(corpo)\n\
          \    except ValueError:\n        dados = {}\n    if status == 201:\n        texto = (f\"Sua manifestação ({tipo})\
          \ foi registrada na Ouvidoria.\\n\"\n                 f\"Protocolo: {dados.get('protocolo')}\\n\"\n            \
