    - id: le_decisao
      type: custom
      data:
        type: code
        title: Ler a decisão
        code_language: python3
        code: "import json\n\nCONFIANCA_MINIMA = 0.5  # abaixo disso, o bot não arrisca: passa para um humano\n\n\ndef main(corpo:\
          \ str, status: int) -> dict:\n    \"\"\"Lê a resposta da Decisions API: a opção vencedora e a confiança (de 0 a\
          \ 1).\"\"\"\n    try:\n        dados = json.loads(corpo)\n    except ValueError:\n        dados = {}\n    resposta\
          \ = (dados.get(\"answers\") or {}).get(\"categoria\") or {}\n    escolha = resposta.get(\"choice\") or \"\"\n  \
          \  confianca = float(resposta.get(\"confidence\") or 0)\n    if status != 200 or not escolha:\n        erro = (dados.get(\"\
          error\") or {}).get(\"message\") or corpo\n        return {\"categoria\": \"erro\", \"confianca\": 0.0, \"detalhe\"\
          : f\"HTTP {status}: {erro}\"[:500]}\n    if confianca < CONFIANCA_MINIMA:\n        return {\"categoria\": \"incerto\"\
          , \"confianca\": confianca, \"detalhe\": json.dumps(resposta.get(\"probabilities\") or {})}\n    return {\"categoria\"\
          : escolha, \"confianca\": confianca, \"detalhe\": \"\"}\n"
        variables:
        - variable: corpo
          value_selector:
          - decisao
          - body
        - variable: status
          value_selector:
          - decisao
          - status_code
        outputs:
          categoria:
            type: string
            children: null
          confianca:
            type: number
            children: null
          detalhe:
            type: string
            children: null
        desc: ''
